version: '3.8'

services:
  app:
    build: .
    container_name: laravel-epi-app
    ports:
      - "8080:80"
    volumes:
      - ./laravel-app/storage:/var/www/html/laravel-app/storage
      - ./laravel-app/database:/var/www/html/laravel-app/database
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/html/laravel-app/database/database.sqlite
    restart: unless-stopped