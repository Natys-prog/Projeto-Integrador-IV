# ==========================================
# DOCKER COMPOSE OTIMIZADO - Parametrizado
# ==========================================
version: '3.8'

# =====================================
# Environment Variables Template
# Copy .env.example to .env and configure
# =====================================
x-app-variables: &app-variables
  # Application
  APP_ENV: ${APP_ENV:-production}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_KEY: ${APP_KEY:-base64:CHANGEME}
  APP_URL: ${APP_URL:-http://localhost:8080}
  
  # Database
  DB_CONNECTION: mysql
  DB_HOST: database
  DB_PORT: 3306
  DB_DATABASE: ${DB_DATABASE:-laravel_epi}
  DB_USERNAME: ${DB_USERNAME:-laravel}
  DB_PASSWORD: ${DB_PASSWORD:-secret}
  
  # Initialization Control
  RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
  RUN_SEEDERS: ${RUN_SEEDERS:-false}
  SEEDER_CLASS: ${SEEDER_CLASS:-DatabaseSeeder}
  FORCE_SEED: ${FORCE_SEED:-false}
  
  # Performance & Cache
  OPTIMIZE_APP: ${OPTIMIZE_APP:-true}
  CLEAR_CACHE: ${CLEAR_CACHE:-true}
  STORAGE_LINK: ${STORAGE_LINK:-true}
  
  # Redis (if enabled)
  REDIS_HOST: redis
  REDIS_PASSWORD: null
  REDIS_PORT: 6379
  
  # Cache & Session
  CACHE_DRIVER: ${CACHE_DRIVER:-redis}
  SESSION_DRIVER: ${SESSION_DRIVER:-redis}
  QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}

services:
  # =====================================
  # Database - MySQL 8.0
  # =====================================
  database:
    image: mysql:8.0
    container_name: ${COMPOSE_PROJECT_NAME:-laravel}-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-laravel_epi}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secret}
      MYSQL_USER: ${DB_USERNAME:-laravel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    ports:
      - "${DB_EXTERNAL_PORT:-3306}:3306"
    networks:
      - laravel-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USERNAME:-laravel}", "-p${DB_PASSWORD:-secret}"]
      timeout: 20s
      retries: 10
      interval: 10s
      start_period: 40s

  # =====================================
  # Redis - Cache & Session Store
  # =====================================
  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-laravel}-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-null}
    volumes:
      - redis_data:/data
    networks:
      - laravel-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 3s
      retries: 5
      interval: 10s

  # =====================================
  # Application - PHP/Laravel
  # =====================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        - APP_ENV=${APP_ENV:-production}
    container_name: ${COMPOSE_PROJECT_NAME:-laravel}-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    environment: *app-variables
    volumes:
      # Persistent storage
      - app_storage:/var/www/html/storage/app
      - app_logs:/var/www/html/storage/logs
      - app_cache:/var/www/html/bootstrap/cache
      # Configuration override (optional)
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - laravel-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/health"]
      timeout: 10s
      retries: 5
      interval: 30s
      start_period: 60s

  # =====================================
  # Queue Worker (Optional)
  # =====================================
  queue:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: ${COMPOSE_PROJECT_NAME:-laravel}-queue
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--verbose", "--tries=3", "--timeout=90"]
    environment: *app-variables
    volumes:
      - app_storage:/var/www/html/storage/app
      - app_logs:/var/www/html/storage/logs
    depends_on:
      app:
        condition: service_healthy
    networks:
      - laravel-network
    deploy:
      replicas: ${QUEUE_WORKERS:-0}
    profiles:
      - queue

  # =====================================
  # Scheduler (Optional)
  # =====================================
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: ${COMPOSE_PROJECT_NAME:-laravel}-scheduler
    restart: unless-stopped
    command: ["/bin/bash", "-c", "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"]
    environment: *app-variables
    volumes:
      - app_storage:/var/www/html/storage/app
      - app_logs:/var/www/html/storage/logs
    depends_on:
      app:
        condition: service_healthy
    networks:
      - laravel-network
    profiles:
      - scheduler

  # =====================================
  # Nginx (Load Balancer - Optional)
  # =====================================
  nginx:
    image: nginx:alpine
    container_name: ${COMPOSE_PROJECT_NAME:-laravel}-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - app_storage:/var/www/html/storage/app:ro
    depends_on:
      - app
    networks:
      - laravel-network
    profiles:
      - nginx

# =====================================
# Named Volumes for Data Persistence
# =====================================
volumes:
  mysql_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:-./docker/data}/mysql
      
  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:-./docker/data}/redis
      
  app_storage:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:-./docker/data}/storage
      
  app_logs:
    driver: local
    driver_opts:
      type: none  
      o: bind
      device: ${DATA_PATH:-./docker/data}/logs
      
  app_cache:
    driver: local

# =====================================
# Network Configuration
# =====================================
networks:
  laravel-network:
    driver: bridge
    ipam:
      config:
        - subnet: ${NETWORK_SUBNET:-172.20.0.0/16}